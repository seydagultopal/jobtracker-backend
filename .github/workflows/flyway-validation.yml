name: Flyway Schema Validation

on:
  push:
    branches:
      - fix/flyway-validation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobtracker_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobtracker_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_PASSWORD: ci-password
      MAIL_PASSWORD: ci-mail-password
      JWT_SECRET: ci-only-signing-secret-at-least-32-characters-long
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests and validate Hibernate schema against Flyway V1
        run: mvn --batch-mode --no-transfer-progress test
